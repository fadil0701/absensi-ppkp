# Apache Configuration untuk Absensi PPKP
# Simpan di: /etc/apache2/sites-available/absensi-ppkp.conf
# Aktifkan dengan: sudo a2ensite absensi-ppkp.conf

<VirtualHost *:80>
    ServerName puspelkes.jakarta.go.id
    ServerAdmin webmaster@puspelkes.jakarta.go.id
    
    DocumentRoot /var/www/html
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/absensi-ppkp_error.log
    CustomLog ${APACHE_LOG_DIR}/absensi-ppkp_access.log combined
    
    # Alias untuk subdirectory
    Alias /absensi-ppkp /var/www/html/absensi-ppkp/public
    
    <Directory /var/www/html/absensi-ppkp/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Laravel rewrite rules
        RewriteEngine On
        RewriteBase /absensi-ppkp/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php?/$1 [L,QSA]
    </Directory>
    
    # Deny access to .htaccess files
    <FilesMatch "^\.ht">
        Require all denied
    </FilesMatch>
</VirtualHost>

