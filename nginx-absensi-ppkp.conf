# Nginx Configuration untuk Absensi PPKP
# Simpan di: /etc/nginx/sites-available/absensi-ppkp
# Aktifkan dengan: sudo ln -s /etc/nginx/sites-available/absensi-ppkp /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name puspelkes.jakarta.go.id;
    
    root /var/www/html;
    index index.php index.html index.htm;

    # Logging
    access_log /var/log/nginx/absensi-ppkp-access.log;
    error_log /var/log/nginx/absensi-ppkp-error.log;

    # Location untuk subdirectory /absensi-ppkp
    location /absensi-ppkp {
        alias /var/www/html/absensi-ppkp/public;
        try_files $uri $uri/ @absensi;
        
        # Laravel specific
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_read_timeout 300;
        }
        
        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Rewrite rule untuk Laravel
    location @absensi {
        rewrite ^/absensi-ppkp/(.*)$ /absensi-ppkp/index.php?/$1 last;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }
}

