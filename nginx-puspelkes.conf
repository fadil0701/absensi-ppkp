# ============================================
# NGINX Reverse Proxy Configuration
# Domain: puspelkes.jakarta.go.id
# Production IP: 10.15.101.117
# Main System: 127.0.0.1:8081
# Absensi (Laravel): 127.0.0.1:8000 at /absensi
# ============================================

# Rate limiting zone for /absensi login protection
limit_req_zone $binary_remote_addr zone=absensi_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=absensi_general:10m rate=30r/s;

server {
    listen 80;
    server_name puspelkes.jakarta.go.id;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name puspelkes.jakarta.go.id;
    
    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/puspelkes.jakarta.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puspelkes.jakarta.go.id/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Hide NGINX version
    server_tokens off;
    
    # Buffer sizes for proxy
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # Logging for Absensi system (separate logs)
    access_log /var/log/nginx/puspelkes-absensi-access.log combined;
    error_log /var/log/nginx/puspelkes-absensi-error.log warn;
    
    # General access log
    access_log /var/log/nginx/puspelkes-access.log combined;
    error_log /var/log/nginx/puspelkes-error.log warn;
    
    # Root location - Main System (port 8081)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        
        # Proxy headers for HTTPS awareness
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Connection settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for streaming responses
        proxy_buffering off;
    }
    
    # Absensi Laravel System (port 8000) - Rate limited
    location /absensi {
        # Rate limiting for login brute-force protection
        limit_req zone=absensi_general burst=10 nodelay;
        
        # Special rate limiting for login endpoints
        location ~ ^/absensi/(login|api/auth/login) {
            limit_req zone=absensi_login burst=2 nodelay;
            
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
        
        # Standard proxy configuration for /absensi
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Critical: Rewrite path to remove /absensi prefix when forwarding to Laravel
        # Laravel expects requests at root, so we rewrite /absensi to /
        rewrite ^/absensi/?(.*)$ /$1 break;
        
        # Proxy headers for HTTPS and Laravel compatibility
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /absensi;
        
        # Connection settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for Laravel responses
        proxy_buffering off;
        
        # Handle redirects (important for Laravel)
        proxy_redirect http://127.0.0.1:8000/ https://$host/absensi/;
        proxy_redirect http://$host/absensi/ https://$host/absensi/;
        proxy_redirect https://$host/ https://$host/absensi/;
    }
    
    # Static assets for Laravel (CSS, JS, images) - optimize caching
    location ~* ^/absensi/(css|js|images|fonts|storage)/ {
        proxy_pass http://127.0.0.1:8000;
        rewrite ^/absensi/(.*)$ /$1 break;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache static assets
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Laravel storage files (public storage)
    location ~* ^/absensi/storage/ {
        proxy_pass http://127.0.0.1:8000;
        rewrite ^/absensi/(.*)$ /$1 break;
        
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Health check endpoint (for monitoring)
    location /absensi/up {
        proxy_pass http://127.0.0.1:8000/up;
        access_log off;
    }
    
    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ^/(\.env|composer\.(json|lock)|package\.(json|lock)|artisan|storage|bootstrap) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Max upload size (adjust as needed)
    client_max_body_size 10M;
    
    # Timeout settings
    keepalive_timeout 65;
    send_timeout 60;
}

