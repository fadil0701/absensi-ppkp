# ============================================
# NGINX Rate Limiting Configuration
# Place this in /etc/nginx/conf.d/rate-limit.conf
# Or include in main nginx.conf http block
# ============================================

# Rate limiting zones
# absensi_login: 5 requests per minute (for login brute-force protection)
# absensi_general: 30 requests per second (general API protection)

limit_req_zone $binary_remote_addr zone=absensi_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=absensi_general:10m rate=30r/s;

# Optional: Connection limiting (prevents connection exhaustion)
limit_conn_zone $binary_remote_addr zone=absensi_conn_limit:10m;

# Usage in server block:
# limit_req zone=absensi_login burst=2 nodelay;
# limit_conn absensi_conn_limit 20;

